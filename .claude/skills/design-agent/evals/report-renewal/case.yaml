schema_version: "1.1"
name: report-renewal
expected_outcome: |
  이미 있는 모바일 숫자 리포트(index.html)를, 물을 수 없는 실행에서 리뉴얼한다. 범위는 「지금 색·구성은 두고 다듬기」로 정했다고 밝히고, 스크립트의 계산·데이터는 그대로 둔다. 서비스가 정한 분류 색 4가지는 남기고, 흐린 글자 대비·작은 글자·작은 누를 곳·고른 탭 표시를 고친다. 타일 배치(구성)는 그대로 두되 핵심 숫자가 가장 크고 증감에 비교 기준(「전주 대비」)과 기호가 붙으며, 표 숫자는 오른쪽 정렬이다. 서랍에 보이는 닫기가 있고, 만든 쪽 말은 고치지 않고 「정한 건지 확인」에 올린다. 고른 값은 DESIGN.md에 남긴다.
