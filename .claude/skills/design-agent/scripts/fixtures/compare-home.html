<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>견주기 시험: 홈</title>
<!-- compare-pages.mjs 시험용. compare-pay.html과 주 버튼 색·모서리, h1 크기, 본문 크기가 조금씩 다르다 -->
<style>
  body { margin: 0; background: #ffffff; color: #1f2328; font-family: Pretendard, sans-serif; font-size: 16px; line-height: 1.6; }

<body>
<main>
  <h1>오늘 들어온 주문</h1>

  <button class="btn" type="button">주문 받기</button>
  <div class="box"><p>준비 중인 주문 3건</p></div>
