<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>견주기 시험: 결제</title>
<!-- compare-home.html과 견준다. 주 버튼 파랑이 미묘하게 다르고(#2a5fe0), 모서리 6px, h1 26px, 본문 15px -->
<style>
  body { margin: 0; background: #ffffff; color: #1f2328; font-family: Pretendard, sans-serif; font-size: 15px; line-height: 1.6; }
  main { padding: 24px; }
  h1 { font-size: 26px; font-weight: 700; margin: 0 0 16px; }
  .btn { background: #2a5fe0; color: #fff; border: 0; border-radius: 6px; height: 48px; padding: 0 20px; font-size: 16px; }
  .box { border: 1px solid #d0d7de; border-radius: 6px; padding: 16px; margin-top: 16px; }
  a { color: #2a5fe0; text-decoration: underline; }
</style>
</head>
<body>
<main>
  <h1>결제하기</h1>
  <p>주문 내용을 확인한 뒤 결제해 주세요. 결제 수단은 <a href="#methods">결제 수단 관리</a>에서 바꿀 수 있어요.</p>
  <button class="btn" type="button">결제하기</button>
  <div class="box"><p>합계 24,000원</p></div>
</main>
</body>
</html>
