<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세부 검사용</title>
<!-- jakub.kr 스킬 모음(MIT)에서 생각을 얻은 검사가 모두 걸리는 화면(2026-11-10). 지어낸 내용이다 -->
<style>
  body { font-family: "Pretendard", sans-serif; font-size: 15px; line-height: 1.6; color: #1f2328; background: #fff; margin: 0; padding: 24px; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  .lead { font-size: 15px; font-weight: 300; }
  .seg { display: inline-flex; padding: 4px; border-radius: 8px; background: #eef1f4; }
  .seg button { border-radius: 8px; background: #fff; border: 0; min-height: 44px; padding: 0 16px; font: inherit; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
  .group { display: flex; flex-direction: column; gap: 8px; }
  .btn { transition: all .3s; background: #1d5fd1; color: #fff; border: 0; min-height: 44px; padding: 0 16px; border-radius: 8px; font: inherit; }
  .btn:hover { background: #164aa6; }
  .tab { transition: background-color 300ms ease; }
  table { border-collapse: collapse; }
  td { padding: 8px 12px; border-bottom: 1px solid #d0d7de; }
  td.num { text-align: right; }
  dialog { border: 1px solid #d0d7de; border-radius: 12px; }
</style>
</head>
<body>
<h1>주문 관리</h1>
<p class="lead">오늘 들어온 주문을 확인하고 처리합니다.</p>
<div class="seg" role="tablist"><button class="tab" role="tab" aria-selected="true">전체</button><button class="tab" role="tab" aria-selected="false">대기</button></div>
<div class="stack">
  <div class="group"><strong>배송지</strong><span>서울시 어딘가 1</span></div>
  <div class="group"><strong>결제 수단</strong><span>카드</span></div>
</div>
<table>
  <tr><td>아메리카노</td><td class="num">1,500</td></tr>
  <tr><td>카페라테</td><td class="num">11,800</td></tr>
  <tr><td>바닐라라테</td><td class="num">4,100</td></tr>
  <tr><td>합계</td><td class="num">17,400</td></tr>
</table>
<ul>
  <li draggable="true">첫째 할 일</li>
  <li draggable="true">둘째 할 일</li>
</ul>
<div class="banner" data-autoplay="5000"><p>이번 주 새 메뉴</p></div>
<form>
  <label>이름 <input name="n" required></label>
  <button type="submit" class="btn" disabled>저장</button>
</form>
<dialog open>
  <p>정말 삭제하시겠습니까?</p>
  <button>취소</button><button>확인</button>
</dialog>
<script>
  document.querySelector('.btn').addEventListener('click', () => { if (confirm('지울까요?')) {} });
</script>
</body>
</html>
