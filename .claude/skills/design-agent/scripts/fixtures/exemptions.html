<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대비 예외 시험</title>
<!-- 시험용. 2026-11-10 실제 서비스 리뷰에서 잘못 잡은 셋(이모지 대비, 로고 글자 대비, 붙은 머리의 흐림)을 다시 잡지 않는지,
     비슷하지만 잡아야 하는 것(브랜드 색 클래스 글자, 떠 있는 카드의 흐림)은 그대로 잡는지 본다 -->
<style>
  body { margin: 0; font-family: Pretendard, sans-serif; background: #ffffff; color: #111111; font-size: 16px; line-height: 1.6; }
  .topbar { position: sticky; top: 0; display: flex; gap: 8px; align-items: center; padding: 12px 16px; background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); }
  .brand-mark { padding: 4px 8px; border-radius: 6px; background: #f20d2f; color: #ffffff; font-weight: 800; font-size: 14px; text-decoration: none; }
  main { padding: 16px; }
  h1 { font-size: 32px; margin: 0 0 16px; }
  .dark { display: flex; gap: 12px; align-items: center; padding: 16px; border-radius: 16px; background: #111111; color: #ffffff; }
  .icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 12px; background: #ffffff; color: #ffffff; font-size: 24px; }
  .text-brand { color: #ff7c71; }
  .float { margin-top: 16px; padding: 16px; border-radius: 16px; background: rgba(255,255,255,0.6); backdrop-filter: blur(8px); }
</style>
</head>
<body>
  <header class="topbar">
    <a class="brand-mark" href="/">MNU</a>
    <span>오늘 뭐 먹지</span>
    <div class="topbar-brand" style="padding:2px 6px;border-radius:6px;background:#f20d2f;color:#ffffff;font-size:13px;font-weight:800">MNU2</div>
  </header>
  <main>
    <h1>메뉴 고르기</h1>
    <div class="dark">
      <span class="icon">🧭</span>
      <span>입맛 검사하러 가기</span>
    </div>
    <p class="text-brand">점심 추천을 바꿨어요</p>
    <div class="float">떠 있는 안내 카드</div>
  </main>
</body>
</html>
