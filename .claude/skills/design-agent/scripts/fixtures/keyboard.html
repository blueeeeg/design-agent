<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>독서 모임 책장</title>
<!-- 키보드로 못 누르는 곳과 꺼진 이유가 title에만 있는 버튼(2026-11-11, ux-basics.md 키보드-1·키보드-3). 지어낸 독서 모임 화면이다 -->
<style>
  body { font-family: "Pretendard", sans-serif; font-size: 16px; line-height: 1.6; color: #1f2328; background: #fff; margin: 0; padding: 24px; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  h2 { font-size: 20px; margin: 24px 0 8px; }
  button { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #d0d7de; background: #fff; font: inherit; }
  .card { border: 1px solid #d0d7de; border-radius: 12px; padding: 16px; cursor: pointer; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<h1>이번 달 책장</h1>

<!-- 클릭만 받는 카드. 안에 버튼·링크가 없다 -->
<div class="card" onclick="openBook(1)">
  <h2>달과 6펜스</h2>
  <p>다음 모임은 11월 20일이에요.</p>
</div>

<h2>갈래</h2>
<ul>
  <li onclick="pick('novel')">소설</li>
  <li onclick="pick('essay')">에세이</li>
</ul>
<p>고른 갈래에 책이 없으면 아직 책이 없어요라고 보여요.</p>

<img src="cover.png" alt="표지 크게 보기" width="120" height="160" onclick="zoom()">
<p><span @click="removeMemo">메모 빼기</span></p>

<h2>모임 설정</h2>
<!-- 꺼진 이유가 title에만 있다 -->
<button type="button" disabled title="모임장만 이름을 바꿀 수 있어요">모임 이름 바꾸기</button>
<!-- 꺼진 버튼을 감싼 span에 title을 단 것 -->
<span title="이번 달 모임이 끝나야 열려요"><button type="button" disabled>다음 책 고르기</button></span>
<!-- aria-describedby가 화면에 안 보이는 글(sr-only)을 가리킨다. 보는 사람은 여전히 title로만 안다 -->
<button type="button" aria-disabled="true" title="책을 한 권 넘게 담아야 해요" aria-describedby="vote-sr">투표 열기</button>
<span id="vote-sr" class="sr-only">책을 한 권 넘게 담아야 해요</span>
<script>
  function openBook() {} function pick() {} function zoom() {} function removeMemo() {}
</script>
</body>
</html>
