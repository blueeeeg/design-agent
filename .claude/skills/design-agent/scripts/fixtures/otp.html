<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이메일 인증</title>
<!-- 인증번호 칸 설정 빠짐이 걸리는 화면(2026-11-12). 지어낸 인증 화면이다.
     otp1: type="number"(앞자리 0 소실, 붙여넣기 오류)
     otp2: inputmode는 있으나 autocomplete 없음(SMS 자동 채움 불가)
     phone: 전화번호 칸 — 잡으면 안 된다
     pw: 비밀번호 칸 — 잡으면 안 된다 -->
<style>
  body { font-family: "Pretendard", sans-serif; font-size: 16px; line-height: 1.6; color: #1f2328; background: #fff; margin: 0; padding: 24px; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  label { display: block; margin-bottom: 4px; }
  input { display: block; width: 100%; font: inherit; padding: 10px 12px; border: 1px solid #8c959f; border-radius: 8px; margin-bottom: 16px; }
  button { min-height: 44px; padding: 0 20px; border-radius: 8px; background: #1f6feb; color: #fff; border: none; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<h1>이메일 인증을 완료해 주세요</h1>
<p>가입하신 이메일로 6자리 인증번호를 보냈습니다.</p>

<!-- 걸림 1: type="number" — 앞자리 0이 소실되고 붙여넣기·자동 채움이 깨진다 -->
<label for="otp1">인증번호</label>
<input type="number" id="otp1" autocomplete="one-time-code" placeholder="6자리 숫자">

<!-- 걸림 2: autocomplete="one-time-code" 없음 — SMS 자동 채움 불가 -->
<label for="otp2">확인 번호</label>
<input type="text" id="otp2" inputmode="numeric" placeholder="이메일로 받은 번호">

<!-- 안 걸림: 전화번호 칸 -->
<label for="phone">전화번호</label>
<input type="tel" id="phone" autocomplete="tel" placeholder="010-0000-0000">

<!-- 안 걸림: 비밀번호 칸 -->
<label for="pw">비밀번호</label>
<input type="password" id="pw" autocomplete="current-password">

<button type="submit">인증 완료</button>
</body>
</html>
