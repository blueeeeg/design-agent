<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>펼치기 표시 하나로 맞춤 시험</title>
<!-- 시험용(2026-11-11). details 세 곳과 aria-expanded 버튼 한 곳이 모두 같은 ::before 표시(▸, 14px, 같은 색)를 쓴다. 열린 것은 ▾로 바꿔 단다.
     기본 표시는 list-style: none과 ::-webkit-details-marker로 지웠다. 펼치기 표시가 섞였다고 잡으면 안 된다 -->
<style>
  body { margin: 0; padding: 16px; font-family: Pretendard, sans-serif; background: #ffffff; color: #111111; font-size: 16px; line-height: 1.6; }
  h1 { font-size: 32px; margin: 0 0 16px; }
  h2 { font-size: 20px; margin: 32px 0 8px; }
  details, .group { border-bottom: 1px solid #8a8f98; padding: 12px 0; }
  summary { list-style: none; cursor: pointer; }
  summary::-webkit-details-marker { display: none; }
  summary::before, .toggle::before { content: "▸"; display: inline-block; width: 16px; margin-right: 8px; font-size: 14px; color: #5b6170; }
  details[open] > summary::before, .toggle[aria-expanded="true"]::before { content: "▾"; }
  .toggle { min-height: 44px; padding: 0; border: 0; background: none; color: #111111; font-size: 16px; }
  p { margin: 8px 0 0; }
</style>
</head>
<body>
  <h1>도움말</h1>
  <h2>자주 묻는 질문</h2>
  <details open>
    <summary>배송은 얼마나 걸리나요</summary>
    <p>주문한 다음 날부터 2~3일 걸립니다.</p>
  </details>
  <details>
    <summary>주문을 바꿀 수 있나요</summary>
    <p>상품을 보내기 전까지 주문 내역에서 바꿀 수 있습니다.</p>
  </details>
  <details>
    <summary>영수증은 어디서 받나요</summary>
    <p>주문 내역의 주문 하나를 열면 영수증 받기가 있습니다.</p>
  </details>
  <h2>설정</h2>
  <div class="group">
    <button class="toggle" type="button" aria-expanded="false" aria-controls="notice-panel">알림 설정</button>
    <div id="notice-panel" hidden>
      <p>주문 알림과 배송 알림을 따로 켜고 끌 수 있습니다.</p>
    </div>
  </div>
</body>
</html>
