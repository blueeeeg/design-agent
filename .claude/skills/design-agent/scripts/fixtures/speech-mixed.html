<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>알림 설정</title>
<!-- 한 화면에 해요체·합니다체·한다체가 섞인 화면(2026-11-11, ux-basics.md 말-2). 지어낸 알림 설정 화면이다 -->
<style>
  body { font-family: "Pretendard", sans-serif; font-size: 16px; line-height: 1.6; color: #1f2328; background: #fff; margin: 0; padding: 24px; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  h2 { font-size: 20px; margin: 24px 0 8px; }
  button { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid #d0d7de; background: #fff; font: inherit; }
  .error { color: #b42318; }
</style>
</head>
<body>
<h1>알림 설정</h1>
<!-- 안내는 해요체 -->
<p>새 글이 올라오면 알려 드려요. 밤 10시부터 아침 8시까지는 소리 없이 보내요.</p>

<h2>받을 알림</h2>
<p><input type="checkbox" id="c1" checked> 댓글</p>
<!-- 도움말은 한다체 -->
<p>댓글 알림은 내 글에 달린 것만 보낸다. 끄면 앱 안 알림 목록에만 남는다.</p>

<!-- 오류는 합니다체 -->
<p class="error" role="alert">설정을 저장하지 못했습니다. 잠시 뒤 다시 시도해 주십시오.</p>
<p>바꾼 설정은 모든 기기에 적용됩니다.</p>

<button type="button">저장</button>
</body>
</html>
