<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자동완성 Autocomplete · UI 메뉴판</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #14212b; font-size: 13.5px; background: #fff; }
  .center { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 14px; }
  .cap { color: #5a6974; font-size: 11px; text-align: center; margin: 10px 0 0; }
  .bar { background: #e7ecef; border-radius: 4px; height: 10px; }
  .mut { color: #5a6974; font-size: 12px; }
</style>
</head>
<body>
<style>
  .au { width: 220px; }
  .au input { width: 100%; padding: 9px 11px; border: 1px solid #d8e0e5; border-radius: 9px; font-size: 12.5px; box-sizing: border-box; font-family: inherit; }
  .au .cd2 { margin-top: 5px; border: 1px solid #e3e9ec; border-radius: 9px; overflow: hidden; font-size: 12px; }
  .au .cd2 div { padding: 8px 11px; cursor: pointer; }
  .au .cd2 div:hover, .au .cd2 .on { background: #f3f6f7; }
  .au b { color: #14212b; }
  .au .cd2 span { color: #5a6974; }
</style>
<div class="center"><div class="au">
  <input value="바이브" aria-label="자동완성 입력">
  <div class="cd2"><div class="on"><b>바이브</b><span>코딩</span></div><div><b>바이브</b><span>코딩 도구</span></div></div>
  <p class="cap">타이핑하면 후보가 뜸</p>
</div></div>
<script>
// 데모용 빈 링크(href="#") 이동 차단 — 인앱 브라우저(스레드 등)에서 iframe 이 엉뚱한 곳으로 튀는 제보 대응 (2026-09-12)
document.addEventListener('click', function (e) {
  var a = e.target.closest('a[href="#"]');
  if (a) e.preventDefault();
});
</script>
</body>
</html>
